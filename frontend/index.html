<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Tab Bar -->
  <nav id="tab-bar"></nav>

  <!-- Main Content Grid -->
  <main id="dashboard">
    <!-- Left Column -->
    <div id="left-column">
      <section id="control-panel">
        <h2>Control Panel</h2>
        <div id="controls-container"></div>
      </section>
      <section id="info-panel">
        <h2>Information</h2>
        <div id="info-content"></div>
      </section>
    </div>

    <!-- Right Column: Simulation -->
    <div id="sim-column">
      <canvas id="sim-canvas"></canvas>
      <div id="sim-placeholder" class="hidden">
        <span>Coming Soon</span>
      </div>
    </div>
  </main>

  <!-- Chat Accordion Drawer -->
  <div id="chat-drawer">
    <div id="chat-header">
      <span id="chat-toggle-label">Chat</span>
      <span id="chat-chevron">&#9650;</span>
      <button id="chat-reset-btn" title="Reset chat">Reset</button>
    </div>
    <div id="chat-body">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Ask a question about this simulation..."
          autocomplete="off"
        />
        <button type="submit" id="chat-send-btn">Send</button>
      </form>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/controlPanel.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
