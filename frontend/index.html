<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Auth Modal Overlay -->
  <div id="auth-overlay">
    <div id="auth-modal">
      <h1>Simulation Dashboard</h1>
      <p>Sign in to save your chat history across sessions.</p>
      <div id="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <input type="text" id="auth-username" placeholder="Username" autocomplete="username" />
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" />
        <div id="auth-error"></div>
        <button type="submit" id="auth-submit">Login</button>
      </form>
      <button type="button" id="auth-guest-btn">Continue as Guest</button>
    </div>
  </div>

  <!-- Top Tab Bar (species groups) -->
  <nav id="tab-bar">
    <div id="user-bar" class="hidden">
      <span id="user-name"></span>
      <button id="logout-btn">Logout</button>
    </div>
    <button id="login-btn" class="hidden">Login</button>
  </nav>

  <!-- Sub-nav: topic pills + species toggle -->
  <div id="sub-nav">
    <div id="topic-pills"></div>
    <div id="species-toggle"></div>
  </div>

  <!-- Main Content Grid -->
  <main id="dashboard">
    <!-- Left Column -->
    <div id="left-column">
      <section id="control-panel">
        <h2>Control Panel</h2>
        <div id="controls-container"></div>
      </section>
      <section id="info-panel">
        <h2>Information</h2>
        <div id="info-content"></div>
      </section>
    </div>

    <!-- Right Column: Simulation -->
    <div id="sim-column">
      <canvas id="sim-canvas"></canvas>
      <div id="sim-placeholder" class="hidden">
        <span>Coming Soon</span>
      </div>
    </div>
  </main>

  <!-- Chat Accordion Drawer -->
  <div id="chat-drawer">
    <div id="chat-header">
      <span id="chat-toggle-label">Chat</span>
      <span id="chat-chevron">&#9650;</span>
      <button id="chat-reset-btn" title="Reset chat">Reset</button>
    </div>
    <div id="chat-body">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input
          type="text"
          id="chat-input"
          placeholder="Ask a question about this simulation..."
          autocomplete="off"
        />
        <button type="submit" id="chat-send-btn">Send</button>
      </form>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/controlPanel.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
